<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>寫作練習 | IELTS Practice Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Serif+TC:wght@600;700&display=swap">
<link rel="stylesheet" href="../style.css">
</head>
<body data-kind="writing">
<header class="exam-bar">
  <a class="brand" href="../" title="回首頁"><b>IELTS</b><span>Writing</span></a>
  <button id="libraryBtn" class="library-btn" type="button">題庫</button>
  <select id="material" aria-label="選擇寫作題目"><option value="">選擇寫作題目…</option></select>
  <div class="timer-box"><span id="clock" class="clock" role="timer" aria-label="剩餘時間">20:00</span><button id="timer" type="button">開始計時</button></div>
  <label class="size"><span>字級</span><select id="fontsize" aria-label="文字大小"><option value="20">標準</option><option value="24">大</option><option value="28" selected>特大</option><option value="32">最大</option><option value="40">超大</option></select></label>
  <details class="more"><summary>工具</summary><div class="more-menu">
    <a href="../">← 首頁</a><a href="../reading/">閱讀練習 →</a>
    <label>練習名稱 <input id="attempt" maxlength="80" placeholder="預設" title="同一題可使用不同名稱分開保存作答"></label>
    <button id="resetTimer" type="button">重設計時</button>
    <button id="downloadText" type="button">下載文字</button>
    <button id="download" type="button" class="primary">下載備份</button>
    <label class="upload">還原備份<input class="file-input" id="restore" type="file" accept="application/json,.json"></label>
    <label class="upload">開啟其他 PDF<input class="file-input" id="pdf" type="file" accept="application/pdf,.pdf"></label>
  </div></details>
</header>
<div class="part-banner"><strong id="partTitle">Writing</strong><span id="partHint">從「題庫」選擇題目後開始寫作。</span><small id="filename"></small></div>
<main class="layout">
  <section class="pane document" aria-label="寫作題目">
    <div class="view-controls"><button id="viewText" type="button" class="active">題目</button><button id="viewPdf" type="button">原始 PDF</button><button id="focus" type="button" aria-pressed="false">專注閱讀</button></div>
    <div class="empty" id="empty"><span class="empty-mark">W</span><strong>開始你的寫作練習</strong><p>題目與圖表顯示在左側，右側為作答區；和電腦考一樣沒有拼字檢查。</p><button id="emptyLibrary" type="button" class="primary">開啟題庫</button></div>
    <article id="textView" class="text-view" hidden></article>
    <iframe id="viewer" title="寫作講義 PDF" hidden></iframe>
    <a id="pdfLink" hidden target="_blank" rel="noopener">另開 PDF（若瀏覽器無法內嵌顯示）</a>
  </section>
  <div id="splitter" class="splitter" role="separator" aria-label="拖曳調整題目與作答區寬度" aria-orientation="vertical" tabindex="0"></div>
  <section class="pane work" aria-label="作答區">
    <div class="tabs" aria-label="選擇寫作任務"><button id="task1" type="button" class="active" aria-pressed="true">Task 1</button><button id="task2" type="button" aria-pressed="false">Task 2</button></div>
    <textarea class="editor" id="editor" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" aria-label="寫作作答"></textarea>
    <div id="wcbar" class="wcbar" aria-hidden="true"></div>
    <div class="stats"><span id="wordcount">Word count: 0</span><span id="target"></span></div>
    <p id="status" class="status" role="status"></p>
    <p class="notice">作答自動保存在此瀏覽器。換裝置或清除瀏覽器資料前，請從「工具」下載備份。</p>
  </section>
</main>
<dialog id="library" class="library" aria-label="題庫">
  <div class="library-head"><h2>寫作題庫</h2><input id="librarySearch" type="search" placeholder="搜尋題目或週次，例如 week 8、maps" aria-label="搜尋題目"><button id="libraryClose" type="button" aria-label="關閉">✕</button></div>
  <div id="libraryList" class="library-list"></div>
</dialog>
<script src="../practice-data.js"></script>
<script src="../shared.js"></script>
<script src="../app.js"></script>
</body>
</html>
