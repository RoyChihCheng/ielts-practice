<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>寫作練習 | IELTS Practice Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Serif+TC:wght@600;700&display=swap">
<link rel="stylesheet" href="../style.css?v=20261108a">
</head>
<body data-kind="writing">
<header class="exam-bar">
  <a class="brand" href="../" title="回首頁"><b>IELTS</b><span>Writing</span></a>
  <button id="libraryBtn" class="library-btn" type="button">題庫</button>
  <select id="practiceMode" aria-label="練習模式"><option value="study">練習模式</option><option value="exam">考試模式</option></select>
  <button id="chooseWriting" type="button" aria-haspopup="dialog">選擇寫作題目・查看題型與主題</button>
  <select id="material" hidden aria-label="選擇寫作題目"><option value="">選擇寫作題目…</option></select>
  <div class="timer-box"><span id="clock" class="clock" role="timer" aria-label="剩餘時間">20:00</span><button id="timer" type="button">開始計時</button></div>
  <label class="size"><span>字級</span><select id="fontsize" aria-label="文字大小"><option value="20">標準</option><option value="24">大</option><option value="28" selected>特大</option><option value="32">最大</option><option value="40">超大</option></select></label>
  <details class="more"><summary>工具</summary><div class="more-menu">
    <a href="../">← 首頁</a><a href="../reading/">閱讀練習 →</a>
    <label>練習名稱 <input id="attempt" maxlength="80" placeholder="預設" title="同一題可使用不同名稱分開保存作答"></label>
    <label>計時方式<select id="timerMode"><option value="standard">建議時間</option><option value="free">不限時</option><option value="custom">自訂時間</option></select></label>
    <label id="customTimeLabel" hidden>自訂分鐘數<input id="customTime" type="number" min="1" max="300" value="40"></label>
    <label><span><input id="lockOnTimeout" type="checkbox"> 時間到鎖定作答</span></label>
    <button id="resetTimer" type="button">重設計時</button>
    <button id="downloadText" type="button">下載文字</button>
    <button id="download" type="button" class="primary">下載 Word 文件</button>
    <label class="upload">還原備份<input class="file-input" id="restore" type="file" accept="application/json,.json"></label>
    <label class="upload">開啟其他 PDF<input class="file-input" id="pdf" type="file" accept="application/pdf,.pdf"></label>
  </div></details>
</header>
<div class="part-banner"><strong id="partTitle">Writing</strong><span id="partHint">從「題庫」選擇題目後開始寫作。</span><small id="filename"></small></div>
<main class="layout">
  <section class="pane document" aria-label="寫作題目">
    <div class="view-controls"><button id="viewText" type="button" class="active">題目</button><button id="viewPdf" type="button">原始 PDF</button><button id="notesBtn" type="button" title="筆記、畫重點與下載">筆記</button><button id="focus" type="button" aria-pressed="false">專注閱讀</button></div>
    <div class="empty" id="empty"><span class="empty-mark">W</span><strong>開始你的寫作練習</strong><p>題目與圖表顯示在左側，右側為作答區；和電腦考一樣沒有拼字檢查。</p><button id="emptyLibrary" type="button" class="primary">開啟題庫</button></div>
    <article id="textView" class="text-view" hidden></article>
    <iframe id="viewer" title="寫作講義 PDF" hidden></iframe>
    <a id="pdfLink" hidden target="_blank" rel="noopener">另開 PDF（若瀏覽器無法內嵌顯示）</a>
    <aside id="notesPanel" class="notes-panel" hidden aria-label="筆記">
      <div class="notes-head"><h2>我的筆記</h2><button id="notesClose" type="button" aria-label="關閉筆記">✕</button></div>
      <label class="notes-label" for="notesText">隨手筆記</label>
      <textarea id="notesText" rows="4" placeholder="構想、論點、可用的句型與單字…"></textarea>
      <h3>畫重點與註記</h3>
      <label class="note-filter">顏色 <select id="noteFilter"><option value="all">全部</option><option value="yellow">黃色</option><option value="green">綠色</option><option value="pink">粉紅色</option><option value="blue">藍色</option></select></label>
      <div id="marksList" class="marks-list"></div>
      <button id="downloadNotes" type="button" class="primary download-notes">下載筆記</button>
    </aside>
  </section>
  <div id="splitter" class="splitter" role="separator" aria-label="拖曳調整題目與作答區寬度" aria-orientation="vertical" tabindex="0"></div>
  <section class="pane work" aria-label="作答區">
    <div class="tabs" aria-label="選擇寫作任務"><button id="task1" type="button" class="active" aria-pressed="true">Task 1</button><button id="task2" type="button" aria-pressed="false">Task 2</button></div>
    <div class="editor-toolbar" role="toolbar" aria-label="文字格式">
      <span>格式</span><button type="button" data-format="bold" title="粗體（Ctrl+B）" aria-label="粗體"><b>B</b></button><button type="button" data-format="italic" title="斜體（Ctrl+I）" aria-label="斜體"><i>I</i></button><button type="button" data-format="underline" title="底線（Ctrl+U）" aria-label="底線"><u>U</u></button><small>選取文字後設定格式</small>
    </div>
    <div class="editor" id="editor" contenteditable="true" role="textbox" aria-multiline="true" spellcheck="false" autocorrect="off" autocapitalize="off" aria-label="寫作作答"></div>
    <div id="wcbar" class="wcbar" aria-hidden="true"></div>
    <div class="stats"><span id="wordcount">Word count: 0</span><span id="target"></span></div>
    <p id="status" class="status" role="status"></p>
    <p class="notice">作答自動保存在此瀏覽器；Word 文件供閱讀與保存，無法還原作答。</p>
  </section>
</main>
<div id="hlbar" class="hlbar" hidden role="toolbar" aria-label="螢光筆">
  <button type="button" data-color="yellow" class="sw sw-yellow" aria-label="黃色螢光筆"></button><button type="button" data-color="green" class="sw sw-green" aria-label="綠色螢光筆"></button><button type="button" data-color="pink" class="sw sw-pink" aria-label="粉紅色螢光筆"></button><button type="button" data-color="blue" class="sw sw-blue" aria-label="藍色螢光筆"></button><button type="button" data-action="note" class="hl-note">註記</button><button type="button" data-action="remove" class="hl-remove">移除</button>
</div>
<dialog id="library" class="library" aria-label="題庫">
  <div class="library-head"><h2>寫作題庫</h2><input id="librarySearch" type="search" placeholder="搜尋題目或週次，例如 week 8、maps" aria-label="搜尋題目"><button id="libraryClose" type="button" aria-label="關閉">✕</button></div>
  <div class="library-filters"><label>任務<select id="filterTask"><option value="">全部 Task</option><option value="1">Task 1</option><option value="2">Task 2</option></select></label><label>題型<select id="filterType"><option value="">全部題型</option></select></label><label>主題<select id="filterTopic"><option value="">全部主題</option></select></label><label>教材<select id="filterSource"><option value="">全部教材</option></select></label></div>
  <div id="libraryList" class="library-list"></div>
</dialog>
<script src="../practice-data.js"></script>
<script src="../shared.js?v=20261108a"></script>
<script src="../vendor/docx.iife.js"></script>
<script src="../export-docx.js?v=20261108a"></script>
<script src="../app.js?v=20261108a"></script>
</body>
</html>
